name: Released SDK check

on:
  workflow_dispatch:
    inputs:
      version:
        description: SDK version on Maven Central
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/verify-released-sdk.sh "$SDK_VERSION"
        env:
          SDK_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: released-sdk-reports
          path: build/reports/released-sdk/
          if-no-files-found: ignore
          retention-days: 7
