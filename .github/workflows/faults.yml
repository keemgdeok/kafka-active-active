name: Repeated fault contracts

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 Asia/Seoul
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seed or inclusive range within 0..19'
        required: true
        default: '0..19'
        type: string

permissions:
  contents: read

concurrency:
  group: faults-${{ github.ref }}
  cancel-in-progress: false

jobs:
  faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: docker version
      # The PR job owns the full integration suite; reserve the nightly budget for repeated faults.
      - run: ./gradlew --no-daemon faultTest "-PfaultSeeds=$FAULT_SEEDS"
        env:
          FAULT_SEEDS: ${{ inputs.seeds || '0..19' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repeated-fault-evidence
          path: |
            build/test-results/faultTest/
            build/reports/tests/faultTest/
            build/reports/faultTest/
          if-no-files-found: ignore
          retention-days: 7
