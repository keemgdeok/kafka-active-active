name: kafka-active-active

x-kafka: &kafka
  image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 20s

x-environment: &environment
  KAFKA_NODE_ID: 1
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  kafka-a:
    <<: *kafka
    ports:
      - "127.0.0.1:19092:9092"
    environment:
      <<: *environment
      CLUSTER_ID: QaH9lFnjS0m1L8o7Yp3Wbg
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:19092,INTERNAL://kafka-a:19092
    volumes:
      - kafka-a-data:/var/lib/kafka/data

  kafka-b:
    <<: *kafka
    ports:
      - "127.0.0.1:29092:9092"
    environment:
      <<: *environment
      CLUSTER_ID: PbK8mGojT1n2M9p8Zq4Xch
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:29092,INTERNAL://kafka-b:19092
    volumes:
      - kafka-b-data:/var/lib/kafka/data

  init-topics:
    image: apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
    depends_on:
      kafka-a:
        condition: service_healthy
      kafka-b:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for broker in kafka-a:19092 kafka-b:19092; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$broker" \
            --create --if-not-exists --topic events --partitions 2 --replication-factor 1 \
            --config retention.ms=-1 --config retention.bytes=-1 --config cleanup.policy=delete
        done

volumes:
  kafka-a-data:
  kafka-b-data:
