# Isolated RF=1 comparison fixture, based on Kafka 4.3's supplied MM2 sample.
# DefaultReplicationPolicy preserves origin names; consume local + remote topic unions.
clusters=A,B
A.bootstrap.servers=a:19092
B.bootstrap.servers=b:19092
A->B.enabled=true
B->A.enabled=true
topics=@TOPIC@
groups=baseline-group-.*
replication.policy.class=org.apache.kafka.connect.mirror.DefaultReplicationPolicy
replication.factor=1
checkpoints.topic.replication.factor=1
heartbeats.topic.replication.factor=1
offset-syncs.topic.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
config.storage.replication.factor=1
offset.storage.partitions=1
status.storage.partitions=1
key.converter=org.apache.kafka.connect.converters.ByteArrayConverter
value.converter=org.apache.kafka.connect.converters.ByteArrayConverter
header.converter=org.apache.kafka.connect.converters.ByteArrayConverter
refresh.topics.interval.seconds=1
refresh.groups.interval.seconds=1
emit.checkpoints.interval.seconds=1
sync.group.offsets.enabled=true
sync.group.offsets.interval.seconds=1
offset.lag.max=0
offset.flush.interval.ms=1000
consumer.auto.offset.reset=earliest
sync.topic.acls.enabled=false
